services:
  dcsmm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: "0.9.0"
    image: dcsmm:latest
    container_name: dcsmm
    restart: unless-stopped
    # DCS runs on another machine (Windows): the ports must be reachable from
    # the local network, not just from the host.
    ports:
      - "8080:8080/tcp"   # web interface
      - "7778:7778/udp"   # position telemetry (live map)
      - "7779:7779/tcp"   # events, players, chat, debriefs
    environment:
      DCSMM_HTTP_ADDR: "0.0.0.0:8080"
      DCSMM_UDP_ADDR: "0.0.0.0:7778"
      DCSMM_TCP_ADDR: "0.0.0.0:7779"
      DCSMM_DB_PATH: "/data/dcsmm.db"
      DCSMM_THEATRE: "Caucasus"
      DCSMM_LOG_LEVEL: "info"
      # Position history retention (seconds). 0 = unlimited.
      DCSMM_TRACK_RETENTION: "86400"
    volumes:
      - dcsmm-data:/data

volumes:
  dcsmm-data:
