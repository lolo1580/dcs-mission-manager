services:
  dcsmm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dcsmm:latest
    container_name: dcsmm
    restart: unless-stopped
    ports:
      # Interface web
      - "8080:8080/tcp"
      # Télémétrie (positions) reçue de DCS
      - "7778:7778/udp"
      # Événements + commandes descendantes (Phase 2+)
      - "7779:7779/tcp"
    environment:
      DCSMM_HTTP_ADDR: "0.0.0.0:8080"
      DCSMM_UDP_ADDR: "0.0.0.0:7778"
      DCSMM_TCP_ADDR: "0.0.0.0:7779"
      DCSMM_DB_PATH: "/data/dcsmm.db"
      DCSMM_THEATRE: "Caucasus"
      DCSMM_LOG_LEVEL: "info"
    volumes:
      # Persistance de la base SQLite (et des débriefs importés, Phase 3)
      - dcsmm-data:/data

volumes:
  dcsmm-data:
