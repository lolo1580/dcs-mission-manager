name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Backend: formatting, vet, unit tests, and a plain build.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: gofmt (no diff allowed)
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The Lua scripts are embedded into the binary. If someone edits dcs-lua/
      # without regenerating, the shipped binary would silently differ.
      - name: Embedded Lua scripts up to date
        run: node tools/gen-lua-embed.mjs --check

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test -race ./...

      - name: go build
        working-directory: backend
        run: go build ./...

  # ---------------------------------------------------------------------------
  # Frontend: reproducible install from the lockfile, then a production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Packaging: build the single self-contained binary (frontend embedded) and
  # actually run it. The product targets Windows only, so this job runs on
  # Windows and exercises the real artifact rather than a Linux stand-in.
  # ---------------------------------------------------------------------------
  binary:
    name: Single binary (Windows)
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build dcsmanager.exe (frontend embedded)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          go build -trimpath -ldflags="-s -w -X main.Version=ci-$sha" -o ../dcsmanager.exe ./cmd/dcsmanager
          if (-not (Test-Path ../dcsmanager.exe)) { throw 'dcsmanager.exe was not produced' }

      - name: Smoke test (runs and serves the UI)
        run: pwsh -File tools/smoke-serve.ps1
