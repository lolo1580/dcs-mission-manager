name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Backend: formatting, vet, unit tests, and a plain build.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: gofmt (no diff allowed)
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The Lua scripts are embedded into the binary. If someone edits dcs-lua/
      # without regenerating, the shipped binary would silently differ.
      - name: Embedded Lua scripts up to date
        run: node tools/gen-lua-embed.mjs --check

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test -race ./...

      - name: go build
        working-directory: backend
        run: go build ./...

  # ---------------------------------------------------------------------------
  # Frontend: reproducible install from the lockfile, then a production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Packaging: build the single self-contained binary (frontend embedded) and
  # actually run it. The product targets Windows only, so this job runs on
  # Windows and exercises the real artifact rather than a Linux stand-in.
  # ---------------------------------------------------------------------------
  binary:
    name: Single binary (Windows)
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build dcsmanager.exe (frontend embedded)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          go build -trimpath -ldflags="-s -w -X main.Version=ci-$sha" -o ../dcsmanager.exe ./cmd/dcsmanager
          if (-not (Test-Path ../dcsmanager.exe)) { throw 'dcsmanager.exe was not produced' }

      - name: Smoke test (runs and serves the UI)
        run: pwsh -File tools/smoke-serve.ps1

  # ---------------------------------------------------------------------------
  # Docker image: build it and check that the container reaches a healthy state.
  # This catches a broken Dockerfile or healthcheck before a release.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=main-${GITHUB_SHA::7} -t dcsmanager-web:ci .

      - name: Validate compose file
        env:
          DCSMANAGER_ADMIN_PASSWORD: ci-password-123
        run: docker compose config --quiet

      - name: Run and check health
        run: |
          docker run -d --name dcsmanager-ci \
            -e DCSMANAGER_ADMIN_USER=admin \
            -e DCSMANAGER_ADMIN_PASSWORD=ci-password-123 \
            -v dcsmanager-ci-data:/data \
            -p 18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            dcsmanager-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs dcsmanager-ci
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish main image (amd64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag dcsmanager-web:ci ghcr.io/${{ github.repository }}:main
          docker tag dcsmanager-web:ci ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}
          docker push ghcr.io/${{ github.repository }}:main
          docker push ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f dcsmanager-ci || true
          docker volume rm dcsmanager-ci-data || true
