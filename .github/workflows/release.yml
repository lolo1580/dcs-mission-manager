name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0-beta.1
#   git push origin v1.0.0-beta.1
#
# Tags containing a pre-release suffix (beta, rc, alpha) are published as GitHub
# pre-releases, so they are never advertised as the latest stable build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0-beta.1)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.tag }}'
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          # "v1.0.0-beta.1" -> "1.0.0-beta.1"
          $version = $tag -replace '^v', ''
          $prerelease = if ($version -match '[A-Za-z]') { 'true' } else { 'false' }
          "tag=$tag"             >> $env:GITHUB_OUTPUT
          "version=$version"     >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag (version $version, prerelease $prerelease)"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Embedded Lua scripts up to date
        run: node tools/gen-lua-embed.mjs --check

      - name: Build dcsmm.exe (frontend embedded)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.Version=$env:VERSION" -o ../dcsmm.exe ./cmd/dcsmm
          if (-not (Test-Path ../dcsmm.exe)) { throw 'dcsmm.exe was not produced' }
          Get-Item ../dcsmm.exe | Select-Object Name, Length

      # The Windows artifact is smoke-tested directly: it is what users download.
      - name: Smoke test the release build
        run: |
          .\dcsmm.exe version
          $proc = Start-Process -FilePath .\dcsmm.exe -PassThru -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              Invoke-RestMethod http://127.0.0.1:8080/api/health -TimeoutSec 2 | Out-Null
              $up = $true
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $up) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'the health endpoint never answered'
          }
          $html = (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).Content
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($html -notmatch '<div id="app">') {
            throw 'the embedded UI is not served (fallback page returned)'
          }
          Write-Host 'OK: dcsmm.exe runs and serves the embedded UI'

      - name: Package the Lua scripts
        run: |
          Compress-Archive -Path dcs-lua/* -DestinationPath "dcsmm-lua-${{ steps.version.outputs.version }}.zip"
          Get-Item dcsmm-lua-*.zip | Select-Object Name, Length

      - name: Checksums
        run: |
          $lines = @()
          foreach ($f in @('dcsmm.exe') + (Get-ChildItem 'dcsmm-lua-*.zip').Name) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $f"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            DCS Mission Manager ${{ steps.version.outputs.version }}.

            This is a **pre-release**: the whole chain is tested, but the Lua
            scripts have not yet been run against a live DCS installation.
            See the CHANGELOG "Beta scope" section for what is and is not verified.

            ## Download

            - `dcsmm.exe` — Windows binary (web UI embedded). Run it, then open
              http://localhost:8080.
            - `dcsmm-lua-*.zip` — the Lua scripts to install into DCS, if you
              prefer not to use the built-in installer (`dcsmm install-lua`).
            - `SHA256SUMS.txt` — checksums.

            ## Quick start

            ```powershell
            .\dcsmm.exe install-lua   # merges the scripts into Saved Games (safe)
            .\dcsmm.exe               # start the manager
            ```

            Then load a mission in DCS. See the README for the full setup.

            > Community project, not affiliated with or endorsed by Eagle Dynamics.
          files: |
            dcsmm.exe
            dcsmm-lua-*.zip
            SHA256SUMS.txt
