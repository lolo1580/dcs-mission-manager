name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0-beta.1
#   git push origin v1.0.0-beta.1
#
# Tags containing a pre-release suffix (beta, rc, alpha) are published as GitHub
# pre-releases, so they are never advertised as the latest stable build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0-beta.1)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.tag }}'
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          # "v1.0.0-beta.1" -> "1.0.0-beta.1"
          $version = $tag -replace '^v', ''
          $projectVersion = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $projectVersion) { throw "Tag $tag does not match VERSION ($projectVersion)" }
          $prerelease = if ($version -match '[A-Za-z]') { 'true' } else { 'false' }
          "tag=$tag"             >> $env:GITHUB_OUTPUT
          "version=$version"     >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag (version $version, prerelease $prerelease)"

      - name: Embedded Lua scripts up to date
        run: node tools/gen-lua-embed.mjs --check

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        env:
          CGO_ENABLED: '0'
        run: pwsh -File tools/build-installer.ps1

      - name: Smoke test embedded application
        run: pwsh -File tools/smoke-serve.ps1 -Exe dist/staging/dcsmanager.exe

      - name: Smoke test installer
        run: |
          pwsh -File tools/build-installer.ps1 -SkipBuild -TestBuild
          pwsh -File tools/test-installer.ps1

      - name: Checksums
        run: |
          $lines = @()
          foreach ($f in @(Get-ChildItem 'dist/DCSManager-Setup-*.exe')) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            DCS Manager ${{ steps.version.outputs.version }}.

            The build and installer are tested automatically. Lua scripts still
            require validation in a live DCS installation; see the CHANGELOG for
            the current validation scope.

            ## Download

            - `DCSManager-Setup-*.exe` — Windows installer. It installs the app for
              the current Windows account and can optionally install the DCS Lua scripts.
            - `SHA256SUMS.txt` — checksums.

            ## Quick start

            ```powershell
            .\DCSManager-Setup-${{ steps.version.outputs.version }}.exe
            ```

            Then load a mission in DCS. See the README for the full setup.

            > Community project, not affiliated with or endorsed by Eagle Dynamics.
          files: |
            dist/DCSManager-Setup-*.exe
            SHA256SUMS.txt
