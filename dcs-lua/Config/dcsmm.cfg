# DCS Mission Manager configuration on the DCS World side.
#
# Place this in: %USERPROFILE%\Saved Games\DCS\Config\dcsmm.cfg
# (or DCS.openbeta depending on your installation)
#
# The manager runs locally, on the same machine as DCS, so the backend address
# stays 127.0.0.1. There is no remote/container mode to configure.

-- Backend address
dcsmm_host = "127.0.0.1"

-- Backend ports
dcsmm_udp_port = 7778
dcsmm_tcp_port = 7779

-- Enable/disable the export
dcsmm_enabled = true

-- Interval (in seconds) between two sends of the player position.
-- 1.0 is a good compromise; don't go too low or it will
-- impact simulator performance.
dcsmm_send_interval = 1.0

-- ---------------------------------------------------------------------------
-- Live map: export of world objects
-- ---------------------------------------------------------------------------

-- Enable the export of all objects (ground units, ships, AI...).
dcsmm_world_enabled = true

-- Interval (in seconds) between two sends of the object list.
-- Higher than the player: the live map doesn't need 1 Hz.
dcsmm_world_interval = 2.0

-- Only send objects within this radius (km) around the player.
-- Set to 0 to send everything (recommended in solo; in multiplayer,
-- a radius limits the network load).
dcsmm_world_radius = 0

-- Maximum number of objects per message (anti-saturation safeguard).
dcsmm_max_objects = 800

-- Coalitions to include in the world export.
dcsmm_coalitions = { "blue", "red" }

-- ---------------------------------------------------------------------------
-- Events, players and chat (hooks)
-- ---------------------------------------------------------------------------

-- Interval (in seconds) between two sends of the player list and
-- their statistics. 5 s is enough for a smooth players panel.
dcsmm_players_interval = 5.0
