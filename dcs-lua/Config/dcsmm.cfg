# Configuration du DCS Mission Manager côté DCS World.
#
# À placer dans : %USERPROFILE%\Saved Games\DCS\Config\dcsmm.cfg
# (ou DCS.openbeta selon ton installation)
#
# En mode Docker sur une autre machine, remplace 127.0.0.1 par l'IP LAN
# de la machine qui héberge le conteneur.

-- Adresse du backend
dcsmm_host = "127.0.0.1"

-- Ports du backend
dcsmm_udp_port = 7778
dcsmm_tcp_port = 7779

-- Activer/désactiver l'export
dcsmm_enabled = true

-- Intervalle (en secondes) entre deux envois de la position du joueur.
-- 1.0 est un bon compromis ; ne pas descendre trop bas pour ne pas
-- impacter les performances du simulateur.
dcsmm_send_interval = 1.0

-- ---------------------------------------------------------------------------
-- Live map : export des objets du monde
-- ---------------------------------------------------------------------------

-- Activer l'export de tous les objets (unités au sol, navires, IA…).
dcsmm_world_enabled = true

-- Intervalle (en secondes) entre deux envois de la liste des objets.
-- Plus élevé que le joueur : la live map n'a pas besoin de 1 Hz.
dcsmm_world_interval = 2.0

-- Ne transmettre que les objets situés dans ce rayon (km) autour du joueur.
-- Mettre 0 pour tout transmettre (recommandé en solo ; en multijoueur,
-- un rayon limite la charge réseau).
dcsmm_world_radius = 0

-- Nombre maximum d'objets par message (garde-fou anti-saturation).
dcsmm_max_objects = 800

-- Coalitions à inclure dans l'export du monde.
dcsmm_coalitions = { "blue", "red" }

-- ---------------------------------------------------------------------------
-- Événements, joueurs et chat (hooks)
-- ---------------------------------------------------------------------------

-- Intervalle (en secondes) entre deux envois de la liste des joueurs et de
-- leurs statistiques. 5 s suffit pour un panneau joueurs fluide.
dcsmm_players_interval = 5.0
