# Configuration du DCS Mission Manager côté DCS World.
#
# À placer dans : %USERPROFILE%\Saved Games\DCS\Config\dcsmm.cfg
# (ou DCS.openbeta selon ton installation)
#
# En mode Docker sur une autre machine, remplace 127.0.0.1 par l'IP LAN
# de la machine qui héberge le conteneur.

-- Adresse du backend
dcsmm_host = "127.0.0.1"

-- Ports du backend
dcsmm_udp_port = 7778
dcsmm_tcp_port = 7779

-- Activer/désactiver l'export
dcsmm_enabled = true

-- Intervalle (en secondes) entre deux envois de positions (live map).
-- 1.0 est un bon compromis ; ne pas descendre trop bas pour ne pas
-- impacter les performances du simulateur.
dcsmm_send_interval = 1.0
