# PostgreSQL for DCS Manager's optional postgres backend.
#
# By default the manager persists to SQLite (see README). To use PostgreSQL:
#
#   docker compose up -d postgres
#   $env:DCSMANAGER_DB_DRIVER = "postgres"
#   $env:DCSMANAGER_DB_DSN    = "postgres://dcs:dcs@localhost:5432/dcsmanager?sslmode=disable"
#   .\dcsmanager.exe
#
# The manager creates its schema on first start. This is a NEW integration: there
# is no data migration from SQLite (see docs/database-backends.md).
services:
  postgres:
    image: postgres:17-alpine
    container_name: dcsmanager-postgres
    environment:
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
      POSTGRES_DB: dcsmanager
    ports:
      - "5432:5432"
    volumes:
      - dcsmanager-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcs -d dcsmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dcsmanager-pgdata:
