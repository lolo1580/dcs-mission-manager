# DCS Manager statistics plugin.
#
# The plugin reads the manager's PostgreSQL database directly (read-only). The
# manager must run with DCSMANAGER_DB_DRIVER=postgres for this to have data.
#
#   docker compose -f stats-plugin/docker-compose.yml up -d postgres
#   # point the manager at it, then:
#   docker compose -f stats-plugin/docker-compose.yml up -d stats-web
#
# If the plugin and PostgreSQL run on another machine than the manager, they do
# not need the manager's HTTP API at all — only the database. The manager can
# stay bound to 127.0.0.1.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
      POSTGRES_DB: dcsmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcs -d dcsmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  stats-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Read-only. On a shared database, prefer a SELECT-only role.
      MANAGER_DATABASE_URL: "postgres://dcs:dcs@postgres:5432/dcsmanager?sslmode=disable"
      PLUGIN_LISTEN_ADDR: ":8090"
      INCLUDE_TEST: "false"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
